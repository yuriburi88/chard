economic_calendar:
  enabled: true                           # Economic Calendar 수집 활성화
  countries:                              # 수집할 국가 리스트
    - united states
    - china
    - japan
    - eurozone
    - canada
    - australia
    - united kingdom
    - germany
    - france
    - south korea
  importance: high                        # 중요도 필터: high, medium, low, all
