llm:
  model: gemini-2.5-flash
  provider: google
  max_tokens: 8000
  temperature: 0.1
  chunk_size: 50000
  parallel_concurrency: 3
preprocessing:
  split_long_messages: true
  max_tokens_per_segment: 4000
  segment_overlap_tokens: 200
normalization:
  embedding_threshold: 0.90  # 0.75 → 0.90 (클러스터링을 더 엄격하게, 서로 다른 키워드를 분리)
  dbscan_min_samples: 2      # 3 → 2 (클러스터 형성 조건 완화)
  llm_verification_enabled: true
  llm_verification_top_n: 30  # 20 → 30 (더 많은 후보 검토)
  embedding_provider: google
  embedding_model: models/text-embedding-004

# 내러티브 세분화 설정 (3단계: Macro → Crypto → Integrated)
# 2단계 Key Points 기반 내러티브 생성 방식 사용
narrative:
  # [DEPRECATED] enable_segmentation 설정은 더 이상 사용되지 않습니다.
  # 2단계 Key Points 기반 내러티브 생성 방식이 항상 사용됩니다.
  # 이 설정은 무시되며, 향후 버전에서 제거될 예정입니다.
  enable_segmentation: true          # DEPRECATED - 항상 true로 동작
  # macro_paragraphs: 2              # [고정] Macro 내러티브는 항상 2개 문단 (과거 분석 + 미래 전망)
  crypto_paragraphs: 2               # Crypto 내러티브 문단 수 (온체인+제도권 통합)
  integrated_paragraphs: 3           # 통합 내러티브 문단 수 (Macro+Crypto 참조)
  min_category_confidence: 0.5       # 카테고리 분류 최소 신뢰도 (deprecated, category_thresholds 사용 권장)

  # 카테고리별 차등 임계값 (2-카테고리 시스템: Macro, Crypto)
  category_thresholds:
    macro: 0.2                       # 거시경제: 중간 수준 (금리, GDP, 인플레이션 등)
    crypto: 0.2                      # 암호화폐: 관대 (BTC, ETH, DeFi, ETF, 규제 등)

  # 동적 키워드 학습 설정
  dynamic_keywords:
    enabled: true                    # 동적 키워드 학습 활성화
    learning_top_n: 30               # 상위 N개 키워드 학습
    min_frequency: 4                 # 최소 출현 빈도
    ttl_hours: 24                    # 키워드 유효 시간 (24시간)
    cache_file: "dynamic_keywords_cache.json"  # 캐시 파일 경로

output:
  top_keywords_count: 10
  summary_paragraphs: 4              # 세분화 비활성화 시 사용되는 문단 수
  log_level: INFO
  log_filename_strategy: timestamp
  log_fixed_window_days: 10
  display_timezone: 9
  output_dir: output
