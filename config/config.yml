# 수집 기간 설정
# mode: "recent_hours" - 현재 시간에서 N시간 전까지 (예: 24시간 전 ~ 현재)
# mode: "days_back" - N일 전 00:00부터 현재까지 (예: 1일 전 = 어제 00:00 ~ 현재)
#
# 예시 (현재 11/24 16:44인 경우):
#   mode: recent_hours, recent_hours: 24 → 11/23 16:44 ~ 현재
#   mode: days_back, days_back: 1 → 11/23 00:00 ~ 현재
#   mode: days_back, days_back: 3 → 11/21 00:00 ~ 현재
collection_period:
  mode: days_back      # "recent_hours" 또는 "days_back"
  days_back: 1         # mode가 "days_back"일 때: N일 전 00:00부터
  recent_hours: 24     # mode가 "recent_hours"일 때: 최근 N시간
