# CHARD Slack + Claude 연동 설정
# 이 파일은 Slack Bot과 Claude API 연동에 필요한 설정을 정의합니다.

# ===========================================
# Slack 설정
# ===========================================
slack:
  # Slack 연동 활성화 여부
  enabled: true

  # Socket Mode 사용 (로컬 PC 실행용, 공인 IP 불필요)
  socket_mode: true

  # 허용된 채널 ID 목록 (비어있으면 모든 채널에서 응답)
  # 특정 채널에서만 응답하려면 채널 ID를 추가하세요
  allowed_channels: []
  # allowed_channels:
  #   - "C0123456789"  # 일반 채널
  #   - "C9876543210"  # 트레이딩 채널

# ===========================================
# Claude API 설정
# ===========================================
claude:
  # 사용할 모델
  # - claude-sonnet-4-20250514: 균형잡힌 성능 (추천)
  # - claude-3-haiku-20240307: 빠르고 저렴 (개발/테스트용)
  model: "claude-sonnet-4-20250514"

  # 최대 토큰 수
  max_tokens: 4096

  # Temperature (0.0 ~ 1.0)
  # 낮을수록 일관된 응답, 높을수록 창의적인 응답
  temperature: 0.7

  # 대화 히스토리 설정
  conversation:
    # 최대 대화 턴 수 (이전 대화 맥락 유지)
    max_history: 10

    # 대화 세션 타임아웃 (분)
    # 이 시간 동안 대화가 없으면 히스토리 초기화
    timeout_minutes: 30

# ===========================================
# 분석 설정
# ===========================================
analysis:
  # 분석 타임아웃 (초)
  # 이 시간이 지나면 분석 실패로 처리
  timeout_seconds: 300

  # 대기열 최대 크기
  # 동시에 대기할 수 있는 분석 요청 수
  max_queue_size: 5

# ===========================================
# 응답 설정
# ===========================================
response:
  # 파일 첨부 여부
  include_files: true

  # JSON 분석 결과 파일 첨부
  include_json: true

  # Markdown 리포트 파일 첨부
  include_markdown: true

  # 표시할 최대 키워드 수
  max_keywords: 5

# ===========================================
# 에러 알림 설정
# ===========================================
error:
  # 에러 발생 시 로그 파일 첨부
  include_log: true

  # 에러 알림 채널 (비어있으면 요청 채널에 응답)
  # error_channel: "C0123456789"
